services:
  mariadb:
    image: mariadb:11.4
    container_name: arrg_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arrg_inventory
      MYSQL_USER: arrg_user
      MYSQL_PASSWORD: arrg_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
