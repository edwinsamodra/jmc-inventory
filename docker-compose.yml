services:
  mariadb:
    image: mariadb:12.3
    container_name: jmc_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jmc_inventory
      MYSQL_USER: jmc_user
      MYSQL_PASSWORD: jmc_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmc_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: jmc_user
      DB_PASSWORD: jmc_password
      DB_NAME: jmc_inventory
      JWT_SECRET: jmc_inventory_secret_key_123456
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jmc_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
